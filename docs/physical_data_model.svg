<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <style>
    .box{fill:#ffffff;stroke:#111827;stroke-width:2}
    .head{fill:#111827}
    .title{fill:#ffffff;font:700 18px Arial,sans-serif}
    .text{fill:#111827;font:14px Arial,sans-serif}
    .line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="300" height="180" class="box"/><rect x="40" y="40" width="300" height="34" class="head"/><text x="54" y="63" class="title">users</text>
  <text x="54" y="98" class="text">id PK</text><text x="54" y="120" class="text">name, email UNIQUE</text><text x="54" y="142" class="text">password</text><text x="54" y="164" class="text">role: ADMIN/CUSTOMER</text><text x="54" y="186" class="text">email_verified_at, timestamps</text>

  <rect x="420" y="40" width="300" height="130" class="box"/><rect x="420" y="40" width="300" height="34" class="head"/><text x="434" y="63" class="title">user_carts</text>
  <text x="434" y="98" class="text">id PK</text><text x="434" y="120" class="text">user_id FK UNIQUE</text><text x="434" y="142" class="text">items JSON, timestamps</text>

  <rect x="40" y="300" width="330" height="230" class="box"/><rect x="40" y="300" width="330" height="34" class="head"/><text x="54" y="323" class="title">products</text>
  <text x="54" y="358" class="text">id PK</text><text x="54" y="380" class="text">name, slug UNIQUE</text><text x="54" y="402" class="text">description</text><text x="54" y="424" class="text">type: DIGITAL/PHYSICAL</text><text x="54" y="446" class="text">price, currency, stock</text><text x="54" y="468" class="text">is_active, metadata JSON</text><text x="54" y="490" class="text">timestamps</text>

  <rect x="430" y="300" width="300" height="150" class="box"/><rect x="430" y="300" width="300" height="34" class="head"/><text x="444" y="323" class="title">product_images</text>
  <text x="444" y="358" class="text">id PK</text><text x="444" y="380" class="text">product_id FK</text><text x="444" y="402" class="text">path, alt</text><text x="444" y="424" class="text">sort_order, timestamps</text>

  <rect x="820" y="240" width="280" height="120" class="box"/><rect x="820" y="240" width="280" height="34" class="head"/><text x="834" y="263" class="title">categories</text>
  <text x="834" y="298" class="text">id PK</text><text x="834" y="320" class="text">name, slug UNIQUE</text><text x="834" y="342" class="text">timestamps</text>

  <rect x="820" y="420" width="280" height="120" class="box"/><rect x="820" y="420" width="280" height="34" class="head"/><text x="834" y="443" class="title">platforms</text>
  <text x="834" y="478" class="text">id PK</text><text x="834" y="500" class="text">name, slug UNIQUE</text><text x="834" y="522" class="text">timestamps</text>

  <rect x="1180" y="240" width="300" height="95" class="box"/><rect x="1180" y="240" width="300" height="34" class="head"/><text x="1194" y="263" class="title">category_product</text>
  <text x="1194" y="298" class="text">category_id FK</text><text x="1194" y="320" class="text">product_id FK</text>

  <rect x="1180" y="420" width="300" height="95" class="box"/><rect x="1180" y="420" width="300" height="34" class="head"/><text x="1194" y="443" class="title">platform_product</text>
  <text x="1194" y="478" class="text">platform_id FK</text><text x="1194" y="500" class="text">product_id FK</text>

  <rect x="40" y="650" width="390" height="300" class="box"/><rect x="40" y="650" width="390" height="34" class="head"/><text x="54" y="673" class="title">orders</text>
  <text x="54" y="708" class="text">id PK, order_number UNIQUE</text><text x="54" y="730" class="text">user_id FK nullable</text><text x="54" y="752" class="text">promo_code_id FK nullable</text><text x="54" y="774" class="text">status, payment_method, shipping_method</text><text x="54" y="796" class="text">currency, subtotal, discount_total</text><text x="54" y="818" class="text">shipping_total, grand_total</text><text x="54" y="840" class="text">customer_full_name, email, phone</text><text x="54" y="862" class="text">country, city, address, zip_code</text><text x="54" y="884" class="text">notes, placed_at, timestamps</text>

  <rect x="520" y="680" width="330" height="190" class="box"/><rect x="520" y="680" width="330" height="34" class="head"/><text x="534" y="703" class="title">order_items</text>
  <text x="534" y="738" class="text">id PK</text><text x="534" y="760" class="text">order_id FK</text><text x="534" y="782" class="text">product_id FK nullable</text><text x="534" y="804" class="text">product_name, product_type</text><text x="534" y="826" class="text">unit_price, quantity, line_total</text><text x="534" y="848" class="text">metadata JSON, timestamps</text>

  <rect x="960" y="680" width="330" height="190" class="box"/><rect x="960" y="680" width="330" height="34" class="head"/><text x="974" y="703" class="title">promo_codes</text>
  <text x="974" y="738" class="text">id PK, code UNIQUE</text><text x="974" y="760" class="text">type: PERCENT/FIXED</text><text x="974" y="782" class="text">value, currency</text><text x="974" y="804" class="text">starts_at, ends_at</text><text x="974" y="826" class="text">usage_limit, used_count</text><text x="974" y="848" class="text">is_active, timestamps</text>

  <path d="M340 105 L420 105" class="line"/>
  <path d="M205 530 L205 650" class="line"/>
  <path d="M370 400 L430 380" class="line"/>
  <path d="M370 360 L1180 285" class="line"/>
  <path d="M1100 300 L1180 285" class="line"/>
  <path d="M370 470 L1180 465" class="line"/>
  <path d="M1100 480 L1180 465" class="line"/>
  <path d="M430 775 L520 775" class="line"/>
  <path d="M685 680 L260 530" class="line"/>
  <path d="M960 775 L430 755" class="line"/>
</svg>
